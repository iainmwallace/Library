<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>My Library</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 80px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .search-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 15px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }

        button:active {
            transform: scale(0.95);
        }

        button:hover {
            background: #5568d3;
        }

        .search-results {
            max-height: 400px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .book-item {
            display: flex;
            gap: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .book-item:active {
            background: #e9ecef;
        }

        .book-cover {
            width: 60px;
            height: 90px;
            object-fit: cover;
            border-radius: 5px;
            background: #ddd;
            flex-shrink: 0;
        }

        .book-info {
            flex: 1;
            min-width: 0;
        }

        .book-title {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .book-author {
            color: #666;
            font-size: 14px;
            margin-bottom: 3px;
        }

        .book-year {
            color: #999;
            font-size: 12px;
        }

        .section-title {
            color: white;
            font-size: 1.8em;
            margin: 30px 0 15px 0;
            font-weight: 600;
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .saved-book {
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            position: relative;
            transition: transform 0.3s;
        }

        .saved-book:active {
            transform: scale(0.95);
        }

        .saved-book-cover {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 10px;
            background: #ddd;
        }

        .saved-book-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 5px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            line-height: 1.3;
        }

        .saved-book-author {
            color: #666;
            font-size: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .remove-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .empty-state {
            background: white;
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            color: #999;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .loading {
            text-align: center;
            color: #666;
            padding: 20px;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.2);
            padding: 5px;
            border-radius: 15px;
        }

        .tab {
            flex: 1;
            padding: 15px;
            background: transparent;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .tab.active {
            background: white;
            color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .recommendation-badge {
            background: #4CAF50;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 5px;
            display: inline-block;
        }

        .series-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 15px;
            border-radius: 10px;
            margin: 15px 0 10px 0;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .series-group {
            margin-bottom: 20px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 20px;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            position: sticky;
            top: 0;
            background: white;
            border-radius: 15px 15px 0 0;
            z-index: 1;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #f0f0f0;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-body {
            padding: 20px;
        }

        .modal-book-header {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .modal-book-cover {
            width: 120px;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
            background: #ddd;
            flex-shrink: 0;
        }

        .modal-book-info h2 {
            font-size: 1.5em;
            margin-bottom: 10px;
            color: #333;
        }

        .modal-book-info p {
            color: #666;
            margin-bottom: 8px;
        }

        .modal-section {
            margin-bottom: 20px;
        }

        .modal-section h3 {
            font-size: 1.2em;
            margin-bottom: 10px;
            color: #667eea;
        }

        .modal-section p {
            color: #666;
            line-height: 1.6;
        }

        .buy-links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .buy-link {
            display: inline-block;
            padding: 12px 20px;
            background: #FF9900;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.3s;
        }

        .buy-link:hover {
            background: #e68a00;
        }

        .buy-link.bookshop {
            background: #667eea;
        }

        .buy-link.bookshop:hover {
            background: #5568d3;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .action-buttons button {
            flex: 1;
        }

        .add-book-btn {
            background: #4CAF50;
        }

        .add-book-btn:hover {
            background: #45a049;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }

            .books-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 10px;
            }

            .modal-book-header {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .modal-book-cover {
                width: 150px;
                height: 225px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 My Library</h1>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('search')">Search Books</button>
            <button class="tab" onclick="switchTab('library')">My Books</button>
            <button class="tab" onclick="switchTab('recommendations')">Recommendations</button>
        </div>

        <div id="search-tab" class="tab-content active">
            <div class="search-section">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search by author or title..." autocomplete="off">
                    <button onclick="searchBooks()">Search</button>
                </div>
                <div id="searchError"></div>
                <div id="searchResults"></div>
            </div>
        </div>

        <div id="library-tab" class="tab-content">
            <h2 class="section-title">My Read Books</h2>
            <div id="myBooks"></div>
        </div>

        <div id="recommendations-tab" class="tab-content">
            <h2 class="section-title">Recommended for You</h2>
            <div id="recommendations"></div>
        </div>
    </div>

    <!-- Book Details Modal -->
    <div id="bookModal" class="modal" onclick="closeModalOnBackdrop(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <button class="modal-close" onclick="closeBookModal()">×</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Content will be inserted here -->
            </div>
        </div>
    </div>

    <script>
        let myBooks = JSON.parse(localStorage.getItem('myBooks') || '[]');
        let lastSearchResults = []; // Store last search results

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            displayMyBooks();
            generateRecommendations();

            // Search on Enter key
            document.getElementById('searchInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    searchBooks();
                }
            });
        });

        function switchTab(tabName) {
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');

            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(tabName + '-tab').classList.add('active');

            // Refresh content
            if (tabName === 'library') {
                displayMyBooks();
            } else if (tabName === 'recommendations') {
                generateRecommendations();
            }
        }

        async function searchBooks() {
            const query = document.getElementById('searchInput').value.trim();
            const resultsDiv = document.getElementById('searchResults');
            const errorDiv = document.getElementById('searchError');

            errorDiv.innerHTML = '';

            if (!query) {
                errorDiv.innerHTML = '<div class="error">Please enter a search term</div>';
                return;
            }

            resultsDiv.innerHTML = '<div class="loading">Searching...</div>';

            try {
                // Using Open Library API
                const response = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(query)}&limit=20`);
                const data = await response.json();

                if (data.docs && data.docs.length > 0) {
                    lastSearchResults = data.docs; // Store for later filtering
                    displaySearchResults(data.docs);
                } else {
                    resultsDiv.innerHTML = '<div class="empty-state">No books found. Try a different search.</div>';
                }
            } catch (error) {
                errorDiv.innerHTML = '<div class="error">Error searching books. Please try again.</div>';
                resultsDiv.innerHTML = '';
            }
        }

        function displaySearchResults(books) {
            const resultsDiv = document.getElementById('searchResults');

            // Filter out books already in library
            let filteredBooks = books.filter(book =>
                !myBooks.some(b => b.key === book.key)
            );

            if (filteredBooks.length === 0) {
                resultsDiv.innerHTML = '<div class="empty-state">All books from this search are already in your library!</div>';
                return;
            }

            // Sort by publication year (newest first)
            filteredBooks.sort((a, b) => {
                const yearA = a.first_publish_year || 0;
                const yearB = b.first_publish_year || 0;
                return yearB - yearA;
            });

            // Group books by series
            const seriesGroups = {};
            const noSeriesBooks = [];

            filteredBooks.forEach(book => {
                // Check for series in title and subjects
                let series = null;

                // Look for series in title (e.g., "Harry Potter and the...", "The Lord of the Rings:")
                const titleMatch = book.title?.match(/^([^:]+(?:series|cycle|trilogy|saga))/i);
                if (titleMatch) {
                    series = titleMatch[1].trim();
                }

                // Check subject field for series info
                if (!series && book.subject) {
                    const seriesSubject = book.subject.find(s =>
                        typeof s === 'string' && (
                            s.toLowerCase().includes('series') ||
                            s.toLowerCase().includes('trilogy') ||
                            s.toLowerCase().includes('saga')
                        )
                    );
                    if (seriesSubject) {
                        series = seriesSubject;
                    }
                }

                // Check if it's part of an actual series field
                if (!series && book.series && book.series.length > 0) {
                    series = book.series[0];
                }

                if (series) {
                    if (!seriesGroups[series]) {
                        seriesGroups[series] = [];
                    }
                    seriesGroups[series].push(book);
                } else {
                    noSeriesBooks.push(book);
                }
            });

            let html = '';

            // Display series groups first
            const seriesNames = Object.keys(seriesGroups).sort();
            if (seriesNames.length > 0) {
                seriesNames.forEach(series => {
                    html += `<div class="series-group">`;
                    html += `<div class="series-header">📚 ${series}</div>`;
                    html += seriesGroups[series].map(book => renderBookItem(book)).join('');
                    html += `</div>`;
                });
            }

            // Display non-series books
            if (noSeriesBooks.length > 0) {
                if (seriesNames.length > 0) {
                    html += `<div class="series-group">`;
                    html += `<div class="series-header">📖 Individual Books</div>`;
                }
                html += noSeriesBooks.map(book => renderBookItem(book)).join('');
                if (seriesNames.length > 0) {
                    html += `</div>`;
                }
            }

            resultsDiv.innerHTML = html;
        }

        function renderBookItem(book, isRecommendation = false) {
            const title = book.title || 'Unknown Title';
            const author = book.author_name ? book.author_name[0] : 'Unknown Author';
            const year = book.first_publish_year || '';
            const coverId = book.cover_i;
            const coverUrl = coverId
                ? `https://covers.openlibrary.org/b/id/${coverId}-M.jpg`
                : '';

            const bookData = {
                title: title,
                author: author,
                year: year,
                cover: coverUrl,
                key: book.key,
                isbn: book.isbn?.[0] || null,
                publisher: book.publisher?.[0] || null,
                subjects: book.subject?.slice(0, 5) || []
            };

            // Escape for onclick
            const bookDataJson = JSON.stringify(bookData).replace(/'/g, "\\'");

            return `
                <div class="book-item" onclick='showBookDetails(${bookDataJson})'>
                    ${coverUrl ? `<img src="${coverUrl}" class="book-cover" alt="${title}">` : '<div class="book-cover"></div>'}
                    <div class="book-info">
                        <div class="book-title">${title}</div>
                        <div class="book-author">${author}</div>
                        <div class="book-year">${year}</div>
                    </div>
                </div>
            `;
        }

        function addBook(book) {
            if (myBooks.some(b => b.key === book.key)) {
                return;
            }

            myBooks.push(book);
            localStorage.setItem('myBooks', JSON.stringify(myBooks));

            // Re-render search results with the book removed
            displaySearchResults(lastSearchResults);

            // Show success feedback
            const errorDiv = document.getElementById('searchError');
            errorDiv.innerHTML = '<div style="background: #d4edda; color: #155724; padding: 15px; border-radius: 10px; margin-bottom: 15px;">✓ Book added to your library!</div>';
            setTimeout(() => errorDiv.innerHTML = '', 2000);
        }

        function displayMyBooks() {
            const myBooksDiv = document.getElementById('myBooks');

            if (myBooks.length === 0) {
                myBooksDiv.innerHTML = '<div class="empty-state">No books yet! Search and add books you\'ve read.</div>';
                return;
            }

            // Sort books by author, then by year (newest first)
            const sortedBooks = [...myBooks].sort((a, b) => {
                const authorCompare = a.author.localeCompare(b.author);
                if (authorCompare !== 0) return authorCompare;
                return (b.year || 0) - (a.year || 0);
            });

            const html = '<div class="books-grid">' + sortedBooks.map((book, index) => {
                const bookDataJson = JSON.stringify(book).replace(/'/g, "\\'");
                const originalIndex = myBooks.findIndex(b => b.key === book.key);

                return `
                    <div class="saved-book" onclick='showBookDetails(${bookDataJson})'>
                        <button class="remove-btn" onclick="event.stopPropagation(); removeBook(${originalIndex})">×</button>
                        ${book.cover ? `<img src="${book.cover}" class="saved-book-cover" alt="${book.title}">` : '<div class="saved-book-cover"></div>'}
                        <div class="saved-book-title">${book.title}</div>
                        <div class="saved-book-author">${book.author}</div>
                    </div>
                `;
            }).join('') + '</div>';

            myBooksDiv.innerHTML = html;
        }

        function removeBook(index) {
            if (confirm('Remove this book from your library?')) {
                myBooks.splice(index, 1);
                localStorage.setItem('myBooks', JSON.stringify(myBooks));
                displayMyBooks();
                generateRecommendations();
            }
        }

        async function generateRecommendations() {
            const recommendationsDiv = document.getElementById('recommendations');

            if (myBooks.length === 0) {
                recommendationsDiv.innerHTML = '<div class="empty-state">Add some books to your library to get personalized recommendations!</div>';
                return;
            }

            recommendationsDiv.innerHTML = '<div class="loading">Generating recommendations...</div>';

            try {
                const recommendations = [];
                const seenKeys = new Set();

                // Extract user preferences
                const authors = [...new Set(myBooks.map(book => book.author))];
                const allSubjects = myBooks.flatMap(book => book.subjects || []);

                // Get top subjects (genres) by frequency, filtering out generic terms
                const genericTerms = [
                    'fiction', 'literature', 'books', 'reading', 'accessible book',
                    'large type books', 'translations', 'classic', 'classics',
                    'open library staff picks', 'new york times bestseller',
                    'bestseller', 'award winners', 'english literature',
                    'american literature', 'british literature', 'contemporary',
                    'modern', 'popular', 'collections', 'anthologies'
                ];

                const subjectFreq = {};
                allSubjects.forEach(s => {
                    const lower = s.toLowerCase();
                    // Only count subjects that are specific genres, not generic terms
                    const isGeneric = genericTerms.some(term =>
                        lower === term || lower.startsWith(term + ',') || lower.endsWith(term)
                    );
                    if (!isGeneric && s.length > 3) {
                        subjectFreq[s] = (subjectFreq[s] || 0) + 1;
                    }
                });

                const topSubjects = Object.entries(subjectFreq)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 5)
                    .map(([subject]) => subject)
                    .filter(s => s && s.length > 3);

                // Strategy 1: Get popular books from top genres (50% of results)
                for (const subject of topSubjects.slice(0, 3)) {
                    try {
                        const response = await fetch(`https://openlibrary.org/search.json?subject=${encodeURIComponent(subject)}&limit=50`);
                        const data = await response.json();

                        if (data.docs) {
                            const filtered = data.docs
                                .filter(book => {
                                    // Extra validation: make sure the book actually matches the genre
                                    const hasMatchingSubject = book.subject?.some(s =>
                                        s.toLowerCase().includes(subject.toLowerCase()) ||
                                        subject.toLowerCase().includes(s.toLowerCase())
                                    );

                                    return !myBooks.some(myBook => myBook.key === book.key) &&
                                        !seenKeys.has(book.key) &&
                                        book.cover_i &&
                                        book.first_publish_year >= 1980 &&
                                        book.author_name && // Must have an author
                                        hasMatchingSubject; // Must actually be in this genre
                                })
                                .sort((a, b) => {
                                    // Sort by popularity
                                    const scoreA = (a.edition_count || 0) + (a.ratings_count || 0) * 10;
                                    const scoreB = (b.edition_count || 0) + (b.ratings_count || 0) * 10;
                                    return scoreB - scoreA;
                                })
                                .slice(0, 3);

                            filtered.forEach(book => {
                                seenKeys.add(book.key);
                                recommendations.push({
                                    ...book,
                                    recommendedBy: subject,
                                    score: (book.edition_count || 0) + (book.ratings_count || 0) * 10 + (book.want_to_read_count || 0)
                                });
                            });
                        }
                    } catch (e) {
                        console.error('Error fetching genre recommendations:', e);
                    }
                }

                // Strategy 2: Discover new authors in same genres (30% of results)
                for (const subject of topSubjects.slice(0, 2)) {
                    try {
                        const response = await fetch(`https://openlibrary.org/search.json?subject=${encodeURIComponent(subject)}&limit=60`);
                        const data = await response.json();

                        if (data.docs) {
                            const newAuthorBooks = data.docs
                                .filter(book => {
                                    const bookAuthor = book.author_name?.[0];
                                    const hasMatchingSubject = book.subject?.some(s =>
                                        s.toLowerCase().includes(subject.toLowerCase()) ||
                                        subject.toLowerCase().includes(s.toLowerCase())
                                    );

                                    return bookAuthor &&
                                        !authors.includes(bookAuthor) &&
                                        !myBooks.some(myBook => myBook.key === book.key) &&
                                        !seenKeys.has(book.key) &&
                                        book.cover_i &&
                                        book.first_publish_year >= 1980 &&
                                        hasMatchingSubject;
                                })
                                .sort((a, b) => (b.edition_count || 0) - (a.edition_count || 0))
                                .slice(0, 2);

                            newAuthorBooks.forEach(book => {
                                seenKeys.add(book.key);
                                recommendations.push({
                                    ...book,
                                    recommendedBy: 'New author',
                                    score: (book.edition_count || 0) + (book.ratings_count || 0) * 5
                                });
                            });
                        }
                    } catch (e) {
                        console.error('Error fetching new author recommendations:', e);
                    }
                }

                // Strategy 3: More from favorite authors (20% of results)
                for (const author of authors.slice(0, 3)) {
                    try {
                        const response = await fetch(`https://openlibrary.org/search.json?author=${encodeURIComponent(author)}&limit=20`);
                        const data = await response.json();

                        if (data.docs) {
                            const filtered = data.docs
                                .filter(book =>
                                    !myBooks.some(myBook => myBook.key === book.key) &&
                                    !seenKeys.has(book.key) &&
                                    book.cover_i &&
                                    book.first_publish_year >= 1970
                                )
                                .sort((a, b) => (b.first_publish_year || 0) - (a.first_publish_year || 0))
                                .slice(0, 2);

                            filtered.forEach(book => {
                                seenKeys.add(book.key);
                                recommendations.push({
                                    ...book,
                                    recommendedBy: author,
                                    recommendationType: 'author',
                                    score: (book.edition_count || 0) + (book.ratings_count || 0) * 10 + 200 // Boost favorite authors
                                });
                            });
                        }
                    } catch (e) {
                        console.error('Error fetching author recommendations:', e);
                    }
                }

                if (recommendations.length === 0) {
                    recommendationsDiv.innerHTML = '<div class="empty-state">No recommendations found. Try adding more books to your library!</div>';
                    return;
                }

                // Sort by score and diversity
                const uniqueRecs = recommendations
                    .sort((a, b) => (b.score || 0) - (a.score || 0))
                    .slice(0, 12);

                const html = '<div class="books-grid">' + uniqueRecs.map(book => {
                    const title = book.title || 'Unknown Title';
                    const author = book.author_name ? book.author_name[0] : 'Unknown Author';
                    const coverId = book.cover_i;
                    const coverUrl = coverId
                        ? `https://covers.openlibrary.org/b/id/${coverId}-M.jpg`
                        : '';

                    const bookData = {
                        title: title,
                        author: author,
                        year: book.first_publish_year || '',
                        cover: coverUrl,
                        key: book.key,
                        isbn: book.isbn?.[0] || null,
                        publisher: book.publisher?.[0] || null,
                        subjects: book.subject?.slice(0, 5) || []
                    };

                    // Format the recommendation reason
                    let reason = 'Based on your reading';
                    if (book.recommendedBy) {
                        if (book.recommendationType === 'author') {
                            reason = `More by ${book.recommendedBy}`;
                        } else if (book.recommendedBy === 'New author') {
                            reason = 'New to you';
                        } else {
                            reason = book.recommendedBy; // Genre name
                        }
                    }

                    const bookDataJson = JSON.stringify(bookData).replace(/'/g, "\\'");

                    return `
                        <div class="saved-book" onclick='showBookDetails(${bookDataJson})'>
                            <div class="recommendation-badge">${reason}</div>
                            ${coverUrl ? `<img src="${coverUrl}" class="saved-book-cover" alt="${title}">` : '<div class="saved-book-cover"></div>'}
                            <div class="saved-book-title">${title}</div>
                            <div class="saved-book-author">${author}</div>
                        </div>
                    `;
                }).join('') + '</div>';

                recommendationsDiv.innerHTML = html;

            } catch (error) {
                console.error('Error generating recommendations:', error);
                recommendationsDiv.innerHTML = '<div class="empty-state">Error loading recommendations. Please try again later.</div>';
            }
        }

        function showBookDetails(book) {
            const modal = document.getElementById('bookModal');
            const modalBody = document.getElementById('modalBody');

            const isAdded = myBooks.some(b => b.key === book.key);

            // Create Amazon and Bookshop search links
            const searchQuery = encodeURIComponent(`${book.title} ${book.author}`);
            const amazonLink = `https://www.amazon.com/s?k=${searchQuery}`;
            const bookshopLink = `https://bookshop.org/search?keywords=${searchQuery}`;
            const googleBooksLink = `https://www.google.com/search?tbm=bks&q=${searchQuery}`;

            const bookDataJson = JSON.stringify(book).replace(/'/g, "\\'");

            modalBody.innerHTML = `
                <div class="modal-book-header">
                    ${book.cover ? `<img src="${book.cover}" class="modal-book-cover" alt="${book.title}">` : '<div class="modal-book-cover"></div>'}
                    <div class="modal-book-info">
                        <h2>${book.title}</h2>
                        <p><strong>Author:</strong> ${book.author}</p>
                        ${book.year ? `<p><strong>Published:</strong> ${book.year}</p>` : ''}
                        ${book.publisher ? `<p><strong>Publisher:</strong> ${book.publisher}</p>` : ''}
                        ${book.isbn ? `<p><strong>ISBN:</strong> ${book.isbn}</p>` : ''}
                    </div>
                </div>

                ${book.subjects && book.subjects.length > 0 ? `
                    <div class="modal-section">
                        <h3>Genres & Topics</h3>
                        <p>${book.subjects.join(', ')}</p>
                    </div>
                ` : ''}

                <div class="modal-section">
                    <h3>Where to Buy</h3>
                    <div class="buy-links">
                        <a href="${amazonLink}" target="_blank" class="buy-link">
                            🛒 Search on Amazon
                        </a>
                        <a href="${bookshopLink}" target="_blank" class="buy-link bookshop">
                            📚 Search on Bookshop.org
                        </a>
                        <a href="${googleBooksLink}" target="_blank" class="buy-link bookshop">
                            🔍 Search Google Books
                        </a>
                    </div>
                </div>

                <div class="action-buttons">
                    ${!isAdded ? `
                        <button class="add-book-btn" onclick='addBookFromModal(${bookDataJson})'>
                            ✓ Add to My Library
                        </button>
                    ` : `
                        <button disabled style="opacity: 0.5;">
                            ✓ Already in Library
                        </button>
                    `}
                    <button onclick="closeBookModal()">Close</button>
                </div>
            `;

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeBookModal() {
            const modal = document.getElementById('bookModal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        function closeModalOnBackdrop(event) {
            if (event.target.id === 'bookModal') {
                closeBookModal();
            }
        }

        function addBookFromModal(book) {
            if (myBooks.some(b => b.key === book.key)) {
                return;
            }

            myBooks.push(book);
            localStorage.setItem('myBooks', JSON.stringify(myBooks));

            closeBookModal();

            // Re-render search results with the book removed if we're on search tab
            if (lastSearchResults.length > 0) {
                displaySearchResults(lastSearchResults);
            }

            // Show success feedback
            const errorDiv = document.getElementById('searchError');
            errorDiv.innerHTML = '<div style="background: #d4edda; color: #155724; padding: 15px; border-radius: 10px; margin-bottom: 15px;">✓ Book added to your library!</div>';
            setTimeout(() => errorDiv.innerHTML = '', 2000);
        }

        // Keep the old addBook function for backward compatibility, but redirect to modal
        function addBook(book) {
            showBookDetails(book);
        }
    </script>
</body>
</html>
