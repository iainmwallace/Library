<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>My Library</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 80px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .search-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 15px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }

        button:active {
            transform: scale(0.95);
        }

        button:hover {
            background: #5568d3;
        }

        .search-results {
            max-height: 400px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .book-item {
            display: flex;
            gap: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .book-item:active {
            background: #e9ecef;
        }

        .book-cover {
            width: 60px;
            height: 90px;
            object-fit: cover;
            border-radius: 5px;
            background: #ddd;
            flex-shrink: 0;
        }

        .book-info {
            flex: 1;
            min-width: 0;
        }

        .book-title {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .book-author {
            color: #666;
            font-size: 14px;
            margin-bottom: 3px;
        }

        .book-year {
            color: #999;
            font-size: 12px;
        }

        .section-title {
            color: white;
            font-size: 1.8em;
            margin: 30px 0 15px 0;
            font-weight: 600;
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .saved-book {
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            position: relative;
            transition: transform 0.3s;
        }

        .saved-book:active {
            transform: scale(0.95);
        }

        .saved-book-cover {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 10px;
            background: #ddd;
        }

        .saved-book-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 5px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            line-height: 1.3;
        }

        .saved-book-author {
            color: #666;
            font-size: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .remove-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .empty-state {
            background: white;
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            color: #999;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .loading {
            text-align: center;
            color: #666;
            padding: 20px;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.2);
            padding: 5px;
            border-radius: 15px;
        }

        .tab {
            flex: 1;
            padding: 15px;
            background: transparent;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .tab.active {
            background: white;
            color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .recommendation-badge {
            background: #4CAF50;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 5px;
            display: inline-block;
        }

        .series-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 15px;
            border-radius: 10px;
            margin: 15px 0 10px 0;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .series-group {
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }

            .books-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 My Library</h1>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('search')">Search Books</button>
            <button class="tab" onclick="switchTab('library')">My Books</button>
            <button class="tab" onclick="switchTab('recommendations')">Recommendations</button>
        </div>

        <div id="search-tab" class="tab-content active">
            <div class="search-section">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search by author or title..." autocomplete="off">
                    <button onclick="searchBooks()">Search</button>
                </div>
                <div id="searchError"></div>
                <div id="searchResults"></div>
            </div>
        </div>

        <div id="library-tab" class="tab-content">
            <h2 class="section-title">My Read Books</h2>
            <div id="myBooks"></div>
        </div>

        <div id="recommendations-tab" class="tab-content">
            <h2 class="section-title">Recommended for You</h2>
            <div id="recommendations"></div>
        </div>
    </div>

    <script>
        let myBooks = JSON.parse(localStorage.getItem('myBooks') || '[]');
        let lastSearchResults = []; // Store last search results

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            displayMyBooks();
            generateRecommendations();

            // Search on Enter key
            document.getElementById('searchInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    searchBooks();
                }
            });
        });

        function switchTab(tabName) {
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');

            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(tabName + '-tab').classList.add('active');

            // Refresh content
            if (tabName === 'library') {
                displayMyBooks();
            } else if (tabName === 'recommendations') {
                generateRecommendations();
            }
        }

        async function searchBooks() {
            const query = document.getElementById('searchInput').value.trim();
            const resultsDiv = document.getElementById('searchResults');
            const errorDiv = document.getElementById('searchError');

            errorDiv.innerHTML = '';

            if (!query) {
                errorDiv.innerHTML = '<div class="error">Please enter a search term</div>';
                return;
            }

            resultsDiv.innerHTML = '<div class="loading">Searching...</div>';

            try {
                // Using Open Library API
                const response = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(query)}&limit=20`);
                const data = await response.json();

                if (data.docs && data.docs.length > 0) {
                    lastSearchResults = data.docs; // Store for later filtering
                    displaySearchResults(data.docs);
                } else {
                    resultsDiv.innerHTML = '<div class="empty-state">No books found. Try a different search.</div>';
                }
            } catch (error) {
                errorDiv.innerHTML = '<div class="error">Error searching books. Please try again.</div>';
                resultsDiv.innerHTML = '';
            }
        }

        function displaySearchResults(books) {
            const resultsDiv = document.getElementById('searchResults');

            // Filter out books already in library
            const filteredBooks = books.filter(book =>
                !myBooks.some(b => b.key === book.key)
            );

            if (filteredBooks.length === 0) {
                resultsDiv.innerHTML = '<div class="empty-state">All books from this search are already in your library!</div>';
                return;
            }

            // Group books by series
            const seriesGroups = {};
            const noSeriesBooks = [];

            filteredBooks.forEach(book => {
                // Check for series in different possible fields
                const series = book.series?.[0] ||
                             (book.subject?.find(s => s.includes('series')) || null);

                if (series) {
                    if (!seriesGroups[series]) {
                        seriesGroups[series] = [];
                    }
                    seriesGroups[series].push(book);
                } else {
                    noSeriesBooks.push(book);
                }
            });

            let html = '';

            // Display series groups first
            Object.keys(seriesGroups).sort().forEach(series => {
                html += `<div class="series-group">`;
                html += `<div class="series-header">📚 ${series}</div>`;
                html += seriesGroups[series].map(book => renderBookItem(book)).join('');
                html += `</div>`;
            });

            // Display non-series books
            if (noSeriesBooks.length > 0) {
                if (Object.keys(seriesGroups).length > 0) {
                    html += `<div class="series-group">`;
                    html += `<div class="series-header">📖 Individual Books</div>`;
                }
                html += noSeriesBooks.map(book => renderBookItem(book)).join('');
                if (Object.keys(seriesGroups).length > 0) {
                    html += `</div>`;
                }
            }

            resultsDiv.innerHTML = html;
        }

        function renderBookItem(book) {
            const title = book.title || 'Unknown Title';
            const author = book.author_name ? book.author_name[0] : 'Unknown Author';
            const year = book.first_publish_year || '';
            const coverId = book.cover_i;
            const coverUrl = coverId
                ? `https://covers.openlibrary.org/b/id/${coverId}-M.jpg`
                : '';

            const bookData = {
                title: title,
                author: author,
                year: year,
                cover: coverUrl,
                key: book.key,
                series: book.series?.[0] || null
            };

            return `
                <div class="book-item" onclick='addBook(${JSON.stringify(bookData)})'>
                    ${coverUrl ? `<img src="${coverUrl}" class="book-cover" alt="${title}">` : '<div class="book-cover"></div>'}
                    <div class="book-info">
                        <div class="book-title">${title}</div>
                        <div class="book-author">${author}</div>
                        <div class="book-year">${year}</div>
                    </div>
                </div>
            `;
        }

        function addBook(book) {
            if (myBooks.some(b => b.key === book.key)) {
                return;
            }

            myBooks.push(book);
            localStorage.setItem('myBooks', JSON.stringify(myBooks));

            // Re-render search results with the book removed
            displaySearchResults(lastSearchResults);

            // Show success feedback
            const errorDiv = document.getElementById('searchError');
            errorDiv.innerHTML = '<div style="background: #d4edda; color: #155724; padding: 15px; border-radius: 10px; margin-bottom: 15px;">✓ Book added to your library!</div>';
            setTimeout(() => errorDiv.innerHTML = '', 2000);
        }

        function displayMyBooks() {
            const myBooksDiv = document.getElementById('myBooks');

            if (myBooks.length === 0) {
                myBooksDiv.innerHTML = '<div class="empty-state">No books yet! Search and add books you\'ve read.</div>';
                return;
            }

            const html = '<div class="books-grid">' + myBooks.map((book, index) => `
                <div class="saved-book">
                    <button class="remove-btn" onclick="removeBook(${index})">×</button>
                    ${book.cover ? `<img src="${book.cover}" class="saved-book-cover" alt="${book.title}">` : '<div class="saved-book-cover"></div>'}
                    <div class="saved-book-title">${book.title}</div>
                    <div class="saved-book-author">${book.author}</div>
                </div>
            `).join('') + '</div>';

            myBooksDiv.innerHTML = html;
        }

        function removeBook(index) {
            if (confirm('Remove this book from your library?')) {
                myBooks.splice(index, 1);
                localStorage.setItem('myBooks', JSON.stringify(myBooks));
                displayMyBooks();
                generateRecommendations();
            }
        }

        async function generateRecommendations() {
            const recommendationsDiv = document.getElementById('recommendations');

            if (myBooks.length === 0) {
                recommendationsDiv.innerHTML = '<div class="empty-state">Add some books to your library to get personalized recommendations!</div>';
                return;
            }

            recommendationsDiv.innerHTML = '<div class="loading">Generating recommendations...</div>';

            try {
                // Get unique authors from user's library
                const authors = [...new Set(myBooks.map(book => book.author))];

                // Fetch books from the same authors
                const recommendations = [];

                for (const author of authors.slice(0, 5)) { // Limit to 5 authors to avoid too many API calls
                    try {
                        const response = await fetch(`https://openlibrary.org/search.json?author=${encodeURIComponent(author)}&limit=10`);
                        const data = await response.json();

                        if (data.docs) {
                            // Filter out books already in user's library
                            const newBooks = data.docs.filter(book =>
                                !myBooks.some(myBook => myBook.key === book.key)
                            ).slice(0, 3); // Take top 3 from each author

                            recommendations.push(...newBooks.map(book => ({
                                ...book,
                                recommendedBy: author
                            })));
                        }
                    } catch (e) {
                        // Continue with next author if one fails
                        console.error('Error fetching recommendations for author:', author, e);
                    }
                }

                // Also get books from similar genres/subjects
                const subjects = [...new Set(myBooks.flatMap(book => book.subjects || []))];
                if (subjects.length > 0) {
                    try {
                        const subject = subjects[0]; // Use first subject
                        const response = await fetch(`https://openlibrary.org/search.json?subject=${encodeURIComponent(subject)}&limit=10`);
                        const data = await response.json();

                        if (data.docs) {
                            const newBooks = data.docs.filter(book =>
                                !myBooks.some(myBook => myBook.key === book.key) &&
                                !recommendations.some(rec => rec.key === book.key)
                            ).slice(0, 5);

                            recommendations.push(...newBooks);
                        }
                    } catch (e) {
                        console.error('Error fetching subject-based recommendations:', e);
                    }
                }

                if (recommendations.length === 0) {
                    recommendationsDiv.innerHTML = '<div class="empty-state">No recommendations found. Add more books to improve recommendations!</div>';
                    return;
                }

                // Remove duplicates and limit
                const uniqueRecs = recommendations.filter((book, index, self) =>
                    index === self.findIndex(b => b.key === book.key)
                ).slice(0, 12);

                const html = '<div class="books-grid">' + uniqueRecs.map(book => {
                    const title = book.title || 'Unknown Title';
                    const author = book.author_name ? book.author_name[0] : 'Unknown Author';
                    const coverId = book.cover_i;
                    const coverUrl = coverId
                        ? `https://covers.openlibrary.org/b/id/${coverId}-M.jpg`
                        : '';

                    const bookData = {
                        title: title,
                        author: author,
                        year: book.first_publish_year || '',
                        cover: coverUrl,
                        key: book.key
                    };

                    const reason = book.recommendedBy ? `By ${book.recommendedBy}` : 'Based on your reading';

                    return `
                        <div class="saved-book" onclick='addBook(${JSON.stringify(bookData)})'>
                            <div class="recommendation-badge">${reason}</div>
                            ${coverUrl ? `<img src="${book.cover}" class="saved-book-cover" alt="${title}">` : '<div class="saved-book-cover"></div>'}
                            <div class="saved-book-title">${title}</div>
                            <div class="saved-book-author">${author}</div>
                        </div>
                    `;
                }).join('') + '</div>';

                recommendationsDiv.innerHTML = html;

            } catch (error) {
                console.error('Error generating recommendations:', error);
                recommendationsDiv.innerHTML = '<div class="empty-state">Error loading recommendations. Please try again later.</div>';
            }
        }
    </script>
</body>
</html>
